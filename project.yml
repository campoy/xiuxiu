name: xiuxiu
options:
  bundleIdPrefix: cat.campoy
  deploymentTarget:
    iOS: "17.0"
packages:
  WhisperFramework:
    path: Packages/WhisperFramework
targets:
  xiuxiu:
    type: application
    platform: iOS
    sources: [xiuxiu, Shared]
    dependencies:
      - package: WhisperFramework
        product: whisper
      # Embeds the share extension in the app bundle.
      - target: xiuxiuShare
    info:
      path: xiuxiu/Info.plist
      properties:
        CFBundleDisplayName: xiuxiu
        NSMicrophoneUsageDescription: xiuxiu records your voice so it can transcribe it on-device.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Without this, canOpenURL("dayone2://") always answers false and the
        # Day One button would never appear even with Day One installed.
        LSApplicationQueriesSchemes: [dayone2]
        # Makes xiuxiu an audio handler, so "Copy to xiuxiu" appears in the share sheet
        # and in Open In. The file arrives at onOpenURL. Alternate rank, because this is
        # not the app that should own audio files on the phone -- it only borrows them.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        # The scheme the share extension uses to wake the app once it has dropped a file off.
        CFBundleURLTypes:
          - CFBundleURLName: cat.campoy.xiuxiu
            CFBundleURLSchemes: [xiuxiu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cat.campoy.xiuxiu
        # Personal Team ID, so re-running xcodegen keeps signing set up. This is the
        # certificate's OU, not the id in its common name -- those differ.
        DEVELOPMENT_TEAM: "88X2U864WM"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: xiuxiu/xiuxiu.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  # Courier only: copies shared audio into the App Group inbox and wakes the app.
  xiuxiuShare:
    type: app-extension
    platform: iOS
    sources: [xiuxiuShare, Shared]
    info:
      path: xiuxiuShare/Info.plist
      properties:
        CFBundleDisplayName: xiuxiu
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Only offer xiuxiu for audio, rather than appearing for every file on the phone.
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a, ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio").@count > 0).@count > 0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cat.campoy.xiuxiu.share
        DEVELOPMENT_TEAM: "88X2U864WM"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: xiuxiuShare/xiuxiuShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
